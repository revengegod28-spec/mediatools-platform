# ============================================================
# Docker Compose للتطوير المحلي الشامل
# ============================================================
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediatools-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - ENABLE_REMBG=true
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: mediatools-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
